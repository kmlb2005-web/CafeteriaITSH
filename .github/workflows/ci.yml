# CI del aseguramiento de calidad (spec 008-qa-foundation).
# Tres trabajos: chequeo de secretos, frontend y backend (con MySQL).
#
# NOTA (2026-11-03): la cuenta de GitHub está bloqueada por facturación y los
# runners hospedados no arrancan ("account is locked due to a billing issue"),
# así que corre en el runner self-hosted local `cafeteria-itsh-win`
# (Windows, etiquetas: self-hosted, windows, X64).
#   - El backend usa MySQL de la máquina y `backend/.env` (dotenv), por eso no
#     hay servicio de contenedor ni variables en este archivo (reglas §21).
#   - Al desbloquear la cuenta: cambiar `runs-on` a `ubuntu-latest`, restaurar
#     el servicio `mysql:8` y las variables `DATABASE_URL`/`JWT_SECRET`/`NODE_ENV`
#     (versión hospedada en el historial de este archivo / research.md R3).

name: CI

on:
  push:
    branches: [main, 'spec/**']
  pull_request:

jobs:
  chequeo-secretos:
    name: Chequeo de secretos (reglas §21)
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Fallar si hay un archivo .env versionado
        shell: powershell
        run: |
          $versionados = git ls-files | Select-String -Pattern '(^|/)\.env$'
          if ($versionados) {
            Write-Error "Hay un archivo .env versionado en el repositorio. Los secretos viven solo en .env local (docs/reglas.md seccion 21)."
            exit 1
          }
          Write-Output "OK: ningun .env versionado (.env.example permitido)."

  frontend:
    name: Frontend (lint + typecheck + pruebas)
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 = versión con la que el proyecto está verificado en local
          # (Node 26 rompe jsdom/localStorage en 9 pruebas de frontend)
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar (lint + typecheck + pruebas)
        run: npm run verify

  backend:
    name: Backend (lint + typecheck + pruebas con MySQL)
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Misma versión que frontend y que el entorno local verificado
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar esquema y migraciones
        run: npm run migrate
      - name: Seed de cuentas operativas (las pruebas inician sesión con ellas)
        run: npm run seed
      - name: Verificar (lint + typecheck + pruebas)
        run: npm run verify
